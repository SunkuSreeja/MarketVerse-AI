kind = "web"
previewPath = "/"
title = "MarketVerse AI"
version = "1.0.0"
id = "artifacts/marketverse"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20352

[services.development]
run = "pnpm --filter @workspace/marketverse run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/marketverse", "run", "build" ]
publicDir = "artifacts/marketverse/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20352"
BASE_PATH = "/"
